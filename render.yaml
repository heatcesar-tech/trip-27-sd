services:
  - type: web
    name: viaje-europa-2027
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: viaje-europa-db
          property: connectionString

databases:
  - name: viaje-europa-db
    plan: free
    databaseName: viaje
    user: viaje_user
